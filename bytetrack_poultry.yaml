# Ultralytics ByteTrack configuration customized for poultry tracking
# Optimized for high occlusion (birds clustering, feeder/drinker occlusion)
# Modified: thresholds lowered to 25% for enhanced detection and RE-ID
tracker_type: bytetrack
track_high_thresh: 0.10  # First-stage match: lowered to 25% (was 0.40) for more sensitive detection
track_low_thresh: 0.04   # Second-stage: lowered to 25% (was 0.15) for tentative re-association
new_track_thresh: 0.10   # Confidence required to spawn a brand-new track ID: lowered to 25% (was 0.40)
track_buffer: 90         # Keep lost tracks alive for 90 frames (~3 s) to survive occlusions
match_thresh: 0.75       # IoU similarity threshold for spatial association
fuse_score: true         # Fuse detection confidence score with spatial IoU

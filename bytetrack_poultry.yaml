# Ultralytics ByteTrack configuration customized for poultry tracking
# Optimized for high occlusion (birds clustering, feeder/drinker occlusion)
tracker_type: bytetrack
track_high_thresh: 0.25  # First-stage match threshold
track_low_thresh: 0.05   # Second-stage threshold for partially occluded birds
new_track_thresh: 0.28   # Confidence required to initialize a new track ID
track_buffer: 60         # Keep lost tracks for 60 frames (~2-4 seconds) to survive feeder occlusions
match_thresh: 0.80       # Association IoU similarity threshold
fuse_score: true         # Fuse detection confidence score with spatial IoU
